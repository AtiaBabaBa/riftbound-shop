<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jake's Card Shop</title>
<meta name="description" content="Riftbound singles. Pick the cards you want and send the list to the shop on LINE.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14l-12 7L4 23V9z' fill='%2310131A' stroke='%2346C3C7' stroke-width='2'/%3E%3Cpath d='M16 8v16M10 12l6 4 6-4M10 20l6-4 6 4' fill='none' stroke='%23D9A84C' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header; card grid on the left, the customer's list on the right (a bottom sheet on phones). */
:root {
  --bg: #ECEFF3; --panel: #FFFFFF; --panel-2: #F5F7FA; --ink: #1A2130; --muted: #5B6577; --line: #D6DCE5;
  --accent: #0E6D77; --accent-ink: #FFFFFF; --accent-soft: #DCEFF0; --gold: #946511;
  --warn: #9A5B00; --warn-bg: #FBEBD0; --loss: #B0362E; --loss-bg: #F6DFDB;
  --fury: #D2453A; --calm: #3B9855; --mind: #3874C6; --body: #DE872B; --chaos: #8C4DC2; --order: #C29C1E; --colorless: #8B93A1;
  --line-green: #06C755; --line-green-ink: #FFFFFF;
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-body: "Barlow", "IBM Plex Sans Thai", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px; --head: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131A; --panel: #171B24; --panel-2: #1D222D; --ink: #E5E9F0; --muted: #98A1B2; --line: #2A3140;
  --accent: #46C3C7; --accent-ink: #08191B; --accent-soft: #163338; --gold: #D9A84C;
  --warn: #F0B35A; --warn-bg: #3A2A12; --loss: #F07C70; --loss-bg: #3A1D1B; --colorless: #9AA2B0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131A; --panel: #171B24; --panel-2: #1D222D; --ink: #E5E9F0; --muted: #98A1B2; --line: #2A3140;
  --accent: #46C3C7; --accent-ink: #08191B; --accent-soft: #163338; --gold: #D9A84C;
  --warn: #F0B35A; --warn-bg: #3A2A12; --loss: #F07C70; --loss-bg: #3A1D1B; --colorless: #9AA2B0; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.r { text-align: right; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand > div { min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 20px; letter-spacing: .03em; font-weight: 700; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) {
  #addFriend { padding: 6px 8px; } #addFriend span { display: none; }
  .brand h1 { font-size: 16px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .brand p { display: none; }
}
.brand p { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* controls */
input[type=text], input[type=search], input[type=password], select, textarea {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; line-height: 1.5; min-height: 64px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.line { background: var(--line-green); color: var(--line-green-ink); border-color: var(--line-green); }
.btn.line:hover { filter: brightness(1.06); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); }
.btn.block { width: 100%; padding-block: 11px; font-size: 15.5px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--panel); padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.notice { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--warn-bg); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.notice code { font-family: var(--f-mono); font-size: 13px; }

/* steps */
.steps { display: flex; gap: 8px 22px; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 8px; }
.steps b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--f-mono); font-size: 12px; flex: none; }

/* page */
.shop { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.browse { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; align-content: start; }
@media (min-width: 1000px) {
  .shop { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; padding-bottom: 32px; }
  .cart { position: sticky; top: calc(var(--head) + 16px); max-height: calc(100vh - var(--head) - 32px); }
}

/* filters */
.filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.frow { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.frow .q { grid-column: 1 / -1; }
@media (min-width: 1280px) { .frow { grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); } .frow .q { grid-column: auto; } }
@media (max-width: 760px) { .frow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.frow2 { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.doms { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 760px) { .doms { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -12px; padding-inline: 12px; } .doms::-webkit-scrollbar { display: none; } }
.dom { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.dom i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); display: inline-block; flex: none; }
.dom[aria-pressed="true"] { border-color: var(--ink); background: var(--panel-2); }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chk input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.resbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--muted); }

/* card grid */
.cards { display: grid; gap: 16px 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pic { position: relative; display: block; width: 100%; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 9px; -webkit-tap-highlight-color: transparent; }
.frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 200 / 279; }
.cimg { display: inline-block; flex: none; border-radius: 7px; background-color: var(--panel-2); background-repeat: no-repeat; }
.cimg.fluid { display: block; width: 100%; height: auto; }
.cimg.pimg { display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); border: 1px solid var(--line); }
.cimg.pimg img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pic .cimg { transition: transform .12s ease, box-shadow .12s ease; box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
.pic:hover .cimg { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--accent), 0 6px 14px rgb(0 0 0 / .2); }
.pic:active .cimg { transform: scale(.97); }
.tile.in .pic .cimg { box-shadow: 0 0 0 3px var(--accent); }
.pic:disabled { cursor: default; }
.pic:disabled .cimg { transform: none; box-shadow: none; }
.tile.out .pic .cimg { filter: grayscale(1) opacity(.5); }
.count { position: absolute; top: 7px; left: 7px; min-width: 28px; height: 28px; padding-inline: 7px; border-radius: 14px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.count.pop { animation: pop .2s ease-out; }
@keyframes pop { from { transform: scale(1.45); } }
.flag { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 5px; text-align: center; background: rgb(12 14 18 / .78); color: #fff; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
.info { position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgb(12 14 18 / .62); color: #fff; cursor: pointer; padding: 0; }
.info:hover { background: rgb(12 14 18 / .85); }
.nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.5em; }
.sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub b { color: var(--gold); font-weight: 600; }
.desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -3px; }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; flex-wrap: wrap; }
.price { font-family: var(--f-mono); font-weight: 600; font-size: 14.5px; }
.ask { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.left { font-size: 11.5px; font-weight: 600; color: var(--warn); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); flex: none; }
.step button { width: 30px; height: 28px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: 17px; line-height: 1; padding: 0; color: var(--ink); border-radius: 999px; }
.step button:disabled { opacity: .35; cursor: not-allowed; }
.step .num { min-width: 20px; text-align: center; font-weight: 600; font-size: 14px; }
.more { justify-self: center; }
.state { padding: 40px 12px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

/* the customer's list */
.cart { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; overflow: hidden; }
.cart-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.cart-head h2 { font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; margin-right: auto; }
.lines { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1 1 auto; min-height: 60px; overscroll-behavior: contain; }
.lines .empty { padding: 26px 18px; color: var(--muted); text-align: center; font-size: 14px; }
.ln { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 16px; }
.ln + .ln { border-top: 1px solid var(--line); }
.ln .cimg { border-radius: 4px; grid-row: span 2; align-self: start; }
.ln .t { font-weight: 600; font-size: 14px; line-height: 1.25; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .s { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .amt { text-align: right; font-size: 13.5px; white-space: nowrap; }
.ln .step { justify-self: end; }
.cart-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 10px; background: var(--panel); }
.tot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tot b { font-size: 18px; }
.foot-row { display: flex; justify-content: space-between; align-items: center; }
.x { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; color: var(--ink); }
.x:hover { background: var(--line); }

/* phones: the list is a bottom sheet, opened from the bar */
.mbar, .scrim { display: none; }
@media (max-width: 999px) {
  .cart { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; max-height: 88dvh; border-radius: 16px 16px 0 0; border-bottom: 0;
    transform: translateY(105%); visibility: hidden; transition: transform .24s ease, visibility 0s linear .24s; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgb(0 0 0 / .25); }
  .cart.open { transform: none; visibility: visible; transition: transform .24s ease; }
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .45); }
  .scrim.open { display: block; }
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgb(0 0 0 / .12); }
  .mbar .what { flex: 1; min-width: 0; line-height: 1.25; }
  .mbar .what b { display: block; font-size: 15px; }
  .mbar .what span { font-size: 13px; color: var(--muted); }
}
@media (min-width: 1000px) { .cart .x { display: none; } }

/* dialogs */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); width: min(680px, calc(100% - 24px)); max-height: calc(100dvh - 24px); max-height: calc(100vh - 24px); }
dialog::backdrop { background: rgb(6 8 12 / .6); }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; }
.dlg-head { display: flex; align-items: center; gap: 10px; }
.dlg-head h2 { font-family: var(--f-display); font-size: 19px; margin-right: auto; }
.ref { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rev { width: 100%; border-collapse: collapse; font-size: 14px; }
.rev td, .rev th { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
.rev .r { text-align: right; white-space: nowrap; }
.rev tfoot th { border-bottom: 0; font-size: 15px; }
.rev tfoot td { border-bottom: 0; padding-top: 0; }
.two { display: grid; gap: 10px; grid-template-columns: 1fr 1.4fr; align-items: start; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
.how { background: var(--panel-2); border-radius: var(--r); padding: 11px 13px; font-size: 13.5px; display: grid; gap: 6px; }
.how a { color: var(--accent); font-weight: 600; }
.qrbox { display: flex; align-items: center; gap: 14px; }
.qrbox svg { flex: none; border-radius: 6px; max-width: 100%; height: auto; }
@media (max-width: 460px) { .qrbox { flex-direction: column; align-items: flex-start; } }
.acts { display: grid; gap: 8px; grid-template-columns: 1fr auto; }
@media (max-width: 460px) { .acts { grid-template-columns: 1fr; } }
details.pv summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }
details.pv pre { margin: 8px 0 0; padding: 10px 12px; background: var(--panel-2); border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 12.5px; max-height: 220px; overflow-y: auto; }
.sent { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

.detail { grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: start; }
.detail.wide { grid-template-columns: minmax(0, 1fr); }
.detail .x { position: absolute; top: 12px; right: 12px; z-index: 1; }
#detail .dlg { position: relative; }
@media (max-width: 600px) { .detail { grid-template-columns: minmax(0, 1fr); } .detail .big { max-width: 300px; justify-self: center; width: 100%; } }
.big { position: relative; }
.big img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .2s; border-radius: 8px; }
.big img.ok { opacity: 1; }
.dinfo { display: grid; gap: 10px; min-width: 0; align-content: start; }
.dinfo h2 { font-size: 21px; line-height: 1.2; padding-right: 40px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13.5px; color: var(--muted); align-items: center; }
.tags .d { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); }
.tags .d i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); display: inline-block; }
.ctext { font-size: 14.5px; line-height: 1.55; background: var(--panel-2); border-radius: 6px; padding: 10px 12px; }
.sdesc { font-size: 14.5px; line-height: 1.55; white-space: pre-line; border-left: 3px solid var(--gold); padding: 2px 0 2px 10px; }
.sdesc b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pbig img { position: static; opacity: 1; width: 100%; height: auto; max-height: 70vh; object-fit: contain; border-radius: 8px; display: block; background: var(--panel-2); }
.dbuy { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.dbuy .price { font-size: 20px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 60; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 1000px) { .toast { bottom: 28px; } }

.ok-t { color: var(--accent); font-weight: 600; } .bad-t { color: var(--loss); font-weight: 600; }

/* shopkeeper zone (shop.html#keeper): the customer's list gives way to the keeper panel */
body.keeper .cart, body.keeper .mbar, body.keeper .scrim, body.keeper .steps { display: none !important; }
@media (min-width: 1000px) { body.keeper .shop { grid-template-columns: minmax(0, 1fr); } }
.kp { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; font-size: 14px; }
.kp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kp-head h2 { font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; }
.kp .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kp .spread { display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.kform { display: grid; gap: 10px; max-width: 380px; }
.kstats { font-weight: 600; }
.sql { margin: 0; padding: 10px 12px; background: var(--panel-2); border-radius: 6px; font-family: var(--f-mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
.setup summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.setup ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 3px; }
.ed-card { display: flex; gap: 12px; align-items: center; }
.ed-card b { font-size: 16px; }
.ed-rows { display: grid; gap: 8px; }
.ed-h, .ed-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto 34px; gap: 8px; align-items: center; }
.ed-h { font-size: 12px; font-weight: 600; color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.qty button { width: 30px; height: 36px; border: 0; background: none; cursor: pointer; font-size: 17px; font-weight: 700; color: var(--ink); padding: 0; }
.qty input[type=text] { width: 42px; border: 0; background: none; text-align: center; padding: 8px 0; border-radius: 0; }
.ed-foot { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.ed-foot #edMsg, .ed-foot #pedMsg { margin-right: auto; }
.ed-row textarea { grid-column: 1 / -1; min-height: 40px; font-size: 14px; }
.ed-row + .ed-row { border-top: 1px solid var(--line); padding-top: 10px; }
.ped { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: start; }
.ped-photo { display: grid; gap: 8px; justify-items: start; }
.ped-img { width: 150px; aspect-ratio: 200 / 279; border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--line); display: grid; place-items: center; overflow: hidden; color: var(--muted); }
.ped-img img { width: 100%; height: 100%; object-fit: contain; }
.ped-fields { display: grid; gap: 10px; min-width: 0; }
.two-num { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 520px) { .ped { grid-template-columns: minmax(0, 1fr); } .ped-photo { grid-template-columns: 96px minmax(0, 1fr); align-items: center; } .ped-img { width: 96px; } }
.btn.danger { color: var(--loss); }

footer { padding-block: 8px 28px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 999px) { footer { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); } .shop { padding-bottom: 8px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap top-row">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14l-12 7L4 23V9z" fill="#10131A" stroke="#46C3C7" stroke-width="2"/><path d="M16 8v16M10 12l6 4 6-4M10 20l6-4 6 4" fill="none" stroke="#D9A84C" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div><h1 id="shopName">Jake's Card Shop</h1><p data-t="tagline"></p></div>
    </div>
    <a class="btn sm" id="addFriend" target="_blank" rel="noopener" data-t-label="addFriend" hidden><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9l-.6 2.7c-.1.5.4.8.8.6 2.7-1.6 6.4-4 8.4-6.2C20.9 14.6 22 12.9 22 11c0-4.4-4.5-8-10-8Z" fill="var(--line-green)"/></svg><span data-t="addFriend"></span></a>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>

<main class="wrap shop">
  <div class="browse">
    <div class="notice" id="notSetup" hidden></div>
    <section class="kp" id="keeper" hidden></section>
    <ol class="steps"><li><b>1</b><span data-t="step1"></span></li><li><b>2</b><span data-t="step2"></span></li><li><b>3</b><span data-t="step3"></span></li></ol>
    <div class="filters" id="filters">
      <div class="frow">
        <input class="q" type="search" id="fQ" data-t-ph="search" autocomplete="off" enterkeyhint="search">
        <select id="fSet" aria-label="Set"></select>
        <select id="fType" aria-label="Type"></select>
        <select id="fRar" aria-label="Rarity"></select>
        <select id="fSort" aria-label="Sort"></select>
      </div>
      <div class="frow2">
        <div class="doms" id="fDoms" role="group" aria-label="Domains"></div>
        <label class="chk" id="fStockWrap" hidden><input type="checkbox" id="fStock"><span></span></label>
      </div>
    </div>
    <div class="resbar"><span id="resCount" aria-live="polite"></span><button type="button" class="btn link" id="fClear" data-t="clearFilters" hidden></button></div>
    <div class="cards" id="grid"><div class="state" data-t="loading"></div></div>
    <button type="button" class="btn more" id="more" data-t="more" hidden></button>
  </div>

  <aside class="cart" id="cart" aria-labelledby="cartTitle">
    <div class="cart-head">
      <h2 id="cartTitle" data-t="myList"></h2>
      <span class="small muted" id="cartCount"></span>
      <button type="button" class="x" id="cartClose" data-t-label="close"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <ul class="lines" id="lines"></ul>
    <div class="cart-foot">
      <div class="tot"><span data-t="total"></span><b class="num" id="cartTotal"></b></div>
      <div class="small muted" id="cartUnpriced" hidden></div>
      <button type="button" class="btn primary block" id="toReview" data-t="review"></button>
      <div class="foot-row"><button type="button" class="btn link small" id="clearCart" data-t="clear"></button></div>
    </div>
  </aside>
</main>

<footer class="wrap"><p data-t="footer"></p></footer>

<div class="scrim" id="scrim"></div>
<div class="mbar" id="mbar">
  <div class="what"><b id="mbCount"></b><span id="mbTotal"></span></div>
  <button type="button" class="btn primary" id="mbOpen" data-t="viewList"></button>
</div>

<dialog id="review" aria-labelledby="revTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="revTitle" data-t="reviewTitle"></h2><span class="ref num" id="revRef"></span>
      <button type="button" class="x" data-close data-t-label="close"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div id="revList"></div>
    <div class="two">
      <label class="field"><span data-t="yourName"></span><input type="text" id="who" autocomplete="name" maxlength="80"></label>
      <label class="field"><span data-t="note"></span><textarea id="note" data-t-ph="notePh" maxlength="600" rows="2"></textarea></label>
    </div>
    <div class="how" id="how"></div>
    <div class="acts">
      <a class="btn line block" id="sendLine" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9l-.6 2.7c-.1.5.4.8.8.6 2.7-1.6 6.4-4 8.4-6.2C20.9 14.6 22 12.9 22 11c0-4.4-4.5-8-10-8Z" fill="currentColor"/></svg><span data-t="send"></span></a>
      <button type="button" class="btn block" id="copyOrder" data-t="copy"></button>
    </div>
    <div class="sent" id="sent" hidden><span data-t="sent"></span><button type="button" class="btn sm" id="sentClear" data-t="clear"></button></div>
    <details class="pv"><summary data-t="preview"></summary><pre id="preview"></pre></details>
  </div>
</dialog>

<dialog id="detail"><div class="dlg detail" id="detailBody"></div></dialog>
<dialog id="editor" aria-labelledby="edTitle"><div class="dlg" id="edBody"></div></dialog>
<dialog id="peditor" aria-labelledby="pedTitle"><div class="dlg" id="pedBody"></div></dialog>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="importFile" accept=".csv,text/csv" hidden>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

function decodeCsv(buf) { try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { return new TextDecoder('windows-874').decode(buf); } }
async function fetchText(url) {

function parseCsv(text) {
  const nl = text.indexOf('\n'), first = nl < 0 ? text : text.slice(0, nl);
  const delim = [';', '\t'].reduce((a, d) => (first.split(d).length > first.split(a).length ? d : a), ',');  // Excel uses ; in some regions
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

const byRank = (a, b) => { const x = rank(a.id), y = rank(b.id); return x[0] - y[0] || x[1] - y[1] || a.id.localeCompare(b.id); };

function csvRows(text) {

  const at = { id: col('id'), name: col('name'), price: col('price'), qty: col('qty'), note: col('note'), descr: col('description') < 0 ? col('descr') : col('description') };
  return body.map((r, i) => {
    const get = k => at[k] < 0 ? '' : String(r[at[k]] ?? '').trim();
    const price = toNum(get('price')), qty = toNum(get('qty')), note = get('note');

async function fetchTable(table, select, order) {

      { headers: { apikey: anonKey, Authorization: `Bearer ${anonKey}`, Prefer: 'count=exact' }, cache: 'no-store' });
    if (!r.ok) { let m = `HTTP ${r.status}`; try { m = (await r.json()).message || m; } catch {} throw new Error(m); }
    const page = await r.json(), total = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
    out.push(...page);

  }
}

async function loadStock() {

        fetchTable('shop_products', 'id,name,price,qty,descr,image,sort', 'sort,created_at.desc'),

      DB.stock.source = 'cloud';
      return {
        rows: rows.map(x => ({ id: x.card_id, name: '', price: numOrNull(x.price), qty: x.qty, note: x.note || '', descr: x.descr || '', line: 0, listed: true })),
        products: products.map(x => ({ id: x.id, name: x.name, price: numOrNull(x.price), qty: x.qty, descr: x.descr || '', image: x.image || '', sort: x.sort || 0 })),

function buildListings() {
  const rows = new Map();  // card id → note (lower case) → row; the same card and note twice: the later row wins
  DB.rows.forEach(r => { if (!rows.has(r.c.id)) rows.set(r.c.id, new Map()); rows.get(r.c.id).set(norm(r.note), r); });
  const out = DB.products.map(p => ({ key: 'p:' + p.id, p, c: null, price: p.price, qty: p.qty, note: '', descr: p.descr, listed: true }));
  DB.cards.forEach(c => {
    const rs = rows.get(c.id);
    if (rs) [...rs].sort((a, b) => a[0].localeCompare(b[0])).forEach(([n, x]) => out.push({ key: c.id + (n ? '|' + n : ''), c, price: x.price, qty: x.qty, note: x.note, descr: x.descr, listed: true }));
    else if (SHOP_CONFIG.showAllCards || K.on) out.push({ key: c.id, c, price: null, qty: null, note: '', descr: '', listed: false });
  });
  DB.listings = out; DB.byKey = new Map(out.map(x => [x.key, x])); DB.stocked = out.some(x => x.listed);
}

async function load() {
  try {
    const [j, stock] = await Promise.all([
      fetch('cards/cards.json').then(r => { if (!r.ok) throw 0; return r.json(); }),
      loadStock(),
    ]);
    DB.sheets = j.sheets; DB.imgBase = j.imgBase;
    // Some Legends are listed twice, by title only ("Matriarch of War") and in full ("Ambessa - Matriarch of War"); keep the full one.
    const legends = j.cards.filter(c => c.t === 'Legend');
    const alias = new Set(legends.filter(c => !c.k.includes(' - ') && legends.some(x => x.k.endsWith(' - ' + c.k))).map(c => c.k));
    DB.cards = j.cards.filter(c => c.im && !alias.has(c.k)).sort(byRank);
    DB.byId = new Map(DB.cards.map(c => [c.id, c])); DB.byName = new Map(DB.cards.map(c => [c.k, c]));
    setStock(stock);
    // Drop cards the shop no longer lists from a saved list, and keep within the stock.
    Object.keys(S.cart).forEach(k => { const x = DB.byKey.get(k), q = Math.min(S.cart[k] | 0, x ? x.qty ?? MAX_COPIES : 0); if (q > 0) S.cart[k] = q; else delete S.cart[k]; });
    saveCart();
    DB.ok = true;
  } catch (e) { console.error(e); DB.failed = true; }
  renderAll();
}
async function reloadStock() { setStock(await loadStock()); renderAll(); }

// ---------- filters ----------
const defaults = () => ({ q: '', set: '', type: '', rar: '', dom: new Set(), stock: false, sort: S.f.sort });
const filtered = () => { const f = S.f, d = defaults(); return f.q || f.set || f.type || f.rar || f.dom.size || f.stock !== d.stock; };
const searchText = new WeakMap();
function hasText(x, q) {
  const words = norm(q).replace(/[\[\]]/g, '').split(' ').filter(Boolean);
  let h = searchText.get(x);
  if (h == null) {
    const c = x.c, parts = x.p ? [x.p.name, x.descr] : [c.n, c.id, cardNo(c), c.st, c.t, ...c.d, ...(c.g || []), readable(c.x), x.note, x.descr];
    h = norm(parts.join(' ').replace(/[\[\]]/g, '')); searchText.set(x, h);
  }
  return words.every(w => h.includes(w));
}
function visible() {
  const f = S.f;
  const xs = DB.listings.filter(x => {
    const c = x.c;
    if (f.stock && !x.listed) return false;  // the shopkeeper's "Listed only"
    if (x.p) return !(f.set || f.rar || f.dom.size || (f.type && f.type !== PRODUCTS)) && (!f.q || hasText(x, f.q));  // products have no set, type or domain
    if (f.type === PRODUCTS) return false;
    if (f.set && !c.s.includes(f.set)) return false;
    if (f.type && c.t !== f.type) return false;
    if (f.rar && c.r !== f.rar) return false;
    if (f.dom.size && !c.d.some(d => f.dom.has(d))) return false;
    return !f.q || hasText(x, f.q);
  });
  if (f.sort === 'name') xs.sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  if (f.sort === 'low' || f.sort === 'high') {
    const s = f.sort === 'low' ? 1 : -1;  // cards without a price go last either way
    xs.sort((a, b) => (a.price == null) - (b.price == null) || s * ((a.price ?? 0) - (b.price ?? 0)));
  }
  return xs;
}
function renderFilters() {

    .sort((a, b) => { const i = s => { const k = SET_ORDER.indexOf(s.toLowerCase()); return k < 0 ? 99 : k; }; return i(a) - i(b); });
  const opts = (all, list, cur, label = v => v) => `<option value="">${esc(all)}</option>` + list.map(v => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label(v))}</option>`).join('');

  $('#fType').innerHTML = opts(t('allTypes'), [...(DB.products.length ? [PRODUCTS] : []), ...TYPES], S.f.type, v => v === PRODUCTS ? t('typeProducts') : v);
  $('#fRar').innerHTML = opts(t('allRarities'), RARITIES.filter(r => DB.listings.some(x => x.c && x.c.r === r)), S.f.rar);
  $('#fSort').innerHTML = [['num', 'sortNum'], ['name', 'sortName'], ...(DB.stocked ? [['low', 'sortLow'], ['high', 'sortHigh']] : [])]
    .map(([v, k]) => `<option value="${v}"${v === S.f.sort ? ' selected' : ''}>${esc(t(k))}</option>`).join('');

function stepper(x, n) {

function refreshTile(key) {

// ---------- the customer's list ----------
const saveCart = () => store.set('rbshop.cart', S.cart);
const cartItems = () => Object.entries(S.cart).map(([k, q]) => ({ x: DB.byKey.get(k), q })).filter(i => i.x && i.q > 0);
function totals(items) {
  const s = { count: 0, total: 0, priced: 0, unpriced: 0 };
  items.forEach(({ x, q }) => { s.count += q; if (x.price != null) { s.total += x.price * q; s.priced += q; } else s.unpriced += q; });
  return s;
}
function addOne(key) {
  const x = DB.byKey.get(key), n = inCart(key); if (!x || x.qty === 0) return;
  if (n >= (x.qty ?? MAX_COPIES)) return toast(t('maxed', x.qty ?? MAX_COPIES));
  setQty(key, n + 1);
  toast(t('added', nameOf(x), n + 1));
}
function setQty(key, q) {
  const x = DB.byKey.get(key); if (!x) return;
  q = Math.max(0, Math.min(q, x.qty ?? MAX_COPIES));
  if (q) S.cart[key] = q; else delete S.cart[key];
  saveCart(); refreshTile(key); renderCart();
  if (S.detail === key) renderDetail();
  if ($('#review').open) renderReview();
}
function renderCart() {
  const items = cartItems(), s = totals(items);

  $('#lines').innerHTML = items.length ? items.map(({ x, q }) => `<li class="ln" data-key="${esc(x.key)}">

  $('#cartTotal').textContent = s.priced ? money(s.total) : s.count ? '—' : money(0);
  $('#cartUnpriced').hidden = !s.unpriced;
  $('#cartUnpriced').textContent = counted('toPrice', s.unpriced, items);
  $('#toReview').disabled = !s.count;
  $('#clearCart').hidden = !s.count;
  $('#mbCount').textContent = s.count ? counted('count', s.count, items) : t('myList');
  $('#mbTotal').textContent = s.count ? (s.priced ? money(s.total) : '') + (s.unpriced ? (s.priced ? ' ' : '') + counted('toPrice', s.unpriced, items) : '') : t('tapCards');
}

function orderText() {
  const items = cartItems(), s = totals(items), L = [`${t('msgTitle')} #${S.ref}`, ''];
  items.forEach(({ x, q }, i) => {
    const price = x.price != null ? t('linePrice', money(x.price), money(x.price * q), q) : t('askPrice');
    L.push(`${i + 1}. ${nameOf(x)}${x.p ? '' : ` (${cardNo(x.c)}${x.note ? ', ' + x.note : ''})`} ×${q} — ${price}`);
  });
  L.push('', `${t('msgTotal')}: ${counted('count', s.count, items)}${s.priced ? ' · ' + money(s.total) : ''}${s.unpriced ? ' ' + counted('toPrice', s.unpriced, items) : ''}`);
  const who = $('#who').value.trim(), note = $('#note').value.trim();
  if (who) L.push(`${t('msgName')}: ${who}`);
  if (note) L.push(`${t('msgNote')}: ${note}`);
  return L.join('\n');
}
function renderReview() {

function updateSend() {
  const text = orderText(), ok = lineReady() && cartItems().length > 0, a = $('#sendLine');

function openReview() {

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch {}
  const ta = Object.assign(document.createElement('textarea'), { value: s, readOnly: true });
  ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
}

// ---------- shopkeeper zone (shop.html#keeper) ----------
// Sign in with a Riftcheese account (the same accounts and saved sign-in as riftbound-prep.html), then tap a card to set its
// price and stock. Saves go to the cloud stock through shop_stock_save (supabase/shop.sql), which only shopkeepers may use.
const SB_LIB = { src: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', sri: 'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok' };
const USER_DOMAIN = 'users.riftprep.app';  // usernames are <name>@this-domain behind the scenes, as in riftbound-prep.html
const ICON_TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// state: 'connecting' | 'out' (signed out) | 'notable' (supabase/shop.sql not run yet) | 'nokeeper' | 'keeper' | 'error' | 'nocloud'
const K = { on: false, sb: null, starting: false, user: null, state: 'connecting', msg: '', busy: false, lastUser: '' };
let E = null;  // the card in the stock editor: { c, orig: its notes as saved, rows: [{ note, price, qty }], busy }

function setMode() {
  K.on = location.hash === '#keeper';
  document.body.classList.toggle('keeper', K.on);

async function keeperInit() {
  if (K.sb || K.starting) return;
  if (!cloudReady()) { K.state = 'nocloud'; return renderKeeper(); }
  K.starting = true; K.state = 'connecting'; renderKeeper();
  try {
    if (!window.supabase) await loadScript(SB_LIB.src, SB_LIB.sri);
    K.sb = window.supabase.createClient(SHOP_CONFIG.cloud.url, SHOP_CONFIG.cloud.anonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'riftprep.auth' } });
    const { data } = await K.sb.auth.getSession();
    if (data && data.session) await keeperCheck(data.session.user);

async function saveEditor() {

// CSV in and out, in the same layout as shop/stock.csv, so the stock can be edited in Excel.
async function importCsv(file) {
  const rows = csvRows(decodeCsv(await file.arrayBuffer()));
  const want = new Map(), seen = new Set(); let skipped = 0;  // card id → note (lower case) → row to save
  rows.forEach(r => {
    const c = rowCard(r);
    if (!c) { if (r.listed) skipped++; return; }
    seen.add(c.id);
    if (!r.listed) return;
    if (!want.has(c.id)) want.set(c.id, new Map());
    const had = DB.rows.find(d => d.c.id === c.id && d.note === r.note);  // a file without a description column keeps the saved ones
    want.get(c.id).set(norm(r.note), { card_id: c.id, note: r.note.slice(0, 40), price: r.price, qty: r.qty, descr: (r.descr ?? (had ? had.descr : '')).slice(0, 1000) });
  });
  const changes = [...want.values()].flatMap(m => [...m.values()]), keep = new Set(changes.map(x => x.card_id + '|' + x.note));
  // Versions of the cards in the file that the file leaves blank come off sale; cards not in the file stay as they are.
  const removed = DB.rows.filter(r => seen.has(r.c.id) && !keep.has(r.c.id + '|' + r.note)).map(r => ({ card_id: r.c.id, note: r.note }));
  if (!changes.length && !removed.length) return alert(t('kImportEmpty'));
  if (!confirm(t('kImportAsk', changes.length, removed.length, skipped))) return;
  K.busy = true; renderKeeper();
  const err = await saveStock(changes, removed);
  K.busy = false; renderKeeper();
  if (err) alert(t('eFail', err)); else toast(t('kImported', changes.length));
}
function exportCsv() {
  const cell = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const by = new Map(); DB.rows.forEach(r => { if (!by.has(r.c.id)) by.set(r.c.id, []); by.get(r.c.id).push(r); });
  const lines = [['id', 'name', 'set', 'rarity', 'price', 'qty', 'note', 'description']];
  DB.cards.forEach(c => (by.get(c.id) || [{}]).forEach(r => lines.push([c.id, c.n, c.id.split('-')[0].toUpperCase(), c.r, r.price ?? '', r.qty ?? '', r.note || '', r.descr || ''])));
  // The BOM makes Excel read it as UTF-8.
  const url = URL.createObjectURL(new Blob(['﻿' + lines.map(l => l.map(cell).join(',')).join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }));
  Object.assign(document.createElement('a'), { href: url, download: 'stock.csv' }).click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function shrinkPhoto(file, max = 1200) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
  const cv = Object.assign(document.createElement('canvas'), { width: w, height: h }), g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);  // JPEG has no transparency: see-through parts of a PNG turn white, not black
  g.drawImage(img, 0, 0, w, h);
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.85));
}
async function saveProduct() {
  const cur = P; if (!cur || cur.busy) return;
  const name = cur.name.trim().slice(0, 80), price = cleanPrice(cur.price), qty = String(cur.qty ?? '').trim();
  if (!name) return pedMsg(t('pNeedName'));
  if (price && !/^\d+(\.\d{1,2})?$/.test(price)) return pedMsg(t('eBadPrice'));
  if (qty && !/^\d+$/.test(qty)) return pedMsg(t('eBadQty'));
  const save = $('#pedBody [data-pe="save"]'), bucket = K.sb.storage.from(PRODUCT_BUCKET);
  cur.busy = true; save.disabled = true; pedMsg(t('eSaving'), false);
  let image = cur.drop ? '' : cur.image, uploaded = '';
  try {
    if (cur.blob) {  // a new file name each time, so nobody is shown an old cached photo
      uploaded = `products/${crypto.randomUUID()}.jpg`;
      const up = await bucket.upload(uploaded, cur.blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (up.error) throw up.error;
      image = uploaded;
    }
    const row = { name, price: price ? +price : null, qty: qty ? +qty : null, descr: cur.descr.trim().slice(0, 1000), image, updated_at: new Date().toISOString() };
    const res = cur.id ? await K.sb.from('shop_products').update(row).eq('id', cur.id).select('id') : await K.sb.from('shop_products').insert(row).select('id');
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error('not allowed');  // the access rules let nothing through
  } catch (e) {
    if (uploaded) bucket.remove([uploaded]).catch(() => {});
    cur.busy = false; save.disabled = false; pedMsg(t('eFail', e.message || String(e)));
    return;
  }
  if (cur.image && cur.image !== image) bucket.remove([cur.image]).catch(() => {});  // the photo it replaced
  await reloadStock().catch(() => {});
  if (P === cur) $('#peditor').close();
  toast(t('eSaved'));
}
async function deleteProduct() {
  const cur = P; if (!cur || cur.busy || !cur.id || !confirm(t('pDeleteAsk', cur.name || t('prodTag')))) return;

  if (res.error || !res.data || !res.data.length) { cur.busy = false; return pedMsg(t('eFail', (res.error && res.error.message) || 'not allowed')); }
  if (cur.image) K.sb.storage.from(PRODUCT_BUCKET).remove([cur.image]).catch(() => {});
  await reloadStock().catch(() => {});
  if (P === cur) $('#peditor').close();
  toast(t('pDeleted'));
}

  applyLang();
  if (DB.ok) renderFilters();
  $('#filters').hidden = !DB.ok;
  renderKeeper(); renderGrid(); renderCart();
  if (S.detail && $('#detail').open) renderDetail();
  if ($('#review').open) renderReview();
}
const setHead = () => document.documentElement.style.setProperty('--head', $('#top').offsetHeight + 'px');

// events
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const key = b.closest('[data-key]')?.dataset.key; if (!key) return;
  const act = b.dataset.act;
  if (act === 'info') openDetail(key);
  else if (K.on && act === 'add') { const x = DB.byKey.get(key); if (x) x.p ? openProductEditor(x.p.id) : openEditor(x.c.id); }
  else if (act === 'add' || act === 'inc') addOne(key);
  else if (act === 'dec') setQty(key, inCart(key) - 1);
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('rbshop.lang', lang); renderAll(); }));
let qTimer;
$('#fQ').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = e.target.value; S.shown = PAGE; renderGrid(); }, 120); });
[['#fSet', 'set'], ['#fType', 'type'], ['#fRar', 'rar'], ['#fSort', 'sort']].forEach(([id, k]) => $(id).addEventListener('change', e => { S.f[k] = e.target.value; S.shown = PAGE; renderGrid(); }));
$('#fStock').addEventListener('change', e => { S.f.stock = e.target.checked; S.shown = PAGE; renderGrid(); });
$('#fDoms').addEventListener('click', e => {
  const b = e.target.closest('[data-dom]'); if (!b) return;
  const d = b.dataset.dom; S.f.dom.has(d) ? S.f.dom.delete(d) : S.f.dom.add(d);
  b.setAttribute('aria-pressed', S.f.dom.has(d)); S.shown = PAGE; renderGrid();
});
$('#fClear').addEventListener('click', () => { S.f = defaults(); S.shown = PAGE; renderFilters(); renderGrid(); });
$('#more').addEventListener('click', showMore);
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) showMore(); }, { rootMargin: '800px 0px' }).observe($('#more'));
$('#mbOpen').addEventListener('click', () => openSheet(true));
$('#cartClose').addEventListener('click', () => openSheet(false));
$('#scrim').addEventListener('click', () => openSheet(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#cart').classList.contains('open') && !document.querySelector('dialog[open]')) openSheet(false); });
$('#toReview').addEventListener('click', openReview);
$('#clearCart').addEventListener('click', clearCart);
$('#sentClear').addEventListener('click', () => { if (clearCart()) { $('#review').close(); openSheet(false); } });
$('#who').addEventListener('input', e => { store.set('rbshop.name', e.target.value.trim()); updateSend(); });
$('#note').addEventListener('input', updateSend);
$('#sendLine').addEventListener('click', e => {
  if (!lineReady() || !cartItems().length) { e.preventDefault(); return; }
  const text = orderText(); e.currentTarget.href = lineSendUrl(text);
  copyText(text);  // a backup in case LINE opens without the text: it can be pasted
  $('#sent').hidden = false;
});
$('#copyOrder').addEventListener('click', async () => { if (await copyText(orderText())) { toast(t('copied')); $('#sent').hidden = false; } });
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => { if (d.id === 'detail') S.detail = null; });
});
addEventListener('hashchange', setMode);
addEventListener('resize', setHead);
setHead();
setMode();
load();
</script>
</body>
</html>
